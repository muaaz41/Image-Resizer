<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creative Resizer</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0b0d12;
        --panel: #111522;
        --text: #e7eaf0;
        --muted: #a9b2c3;
        --border: rgba(255, 255, 255, 0.12);
        --accent: #7c5cff;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f6f7fb;
          --panel: #ffffff;
          --text: #0f172a;
          --muted: #475569;
          --border: rgba(15, 23, 42, 0.12);
          --accent: #4f46e5;
        }
      }
      body {
        margin: 0;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Helvetica,
          Arial,
          "Apple Color Emoji",
          "Segoe UI Emoji";
        background: var(--bg);
        color: var(--text);
      }
      .wrap {
        max-width: 960px;
        padding: 24px;
        margin: 0 auto;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 12px;
        letter-spacing: 0.2px;
      }
      .subtle {
        font-size: 12px;
        color: var(--muted);
        margin: 0 0 14px;
        line-height: 1.4;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      @media (max-width: 820px) {
        .row {
          grid-template-columns: 1fr;
        }
      }
      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      input[type="number"],
      input[type="file"] {
        width: 100%;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        box-sizing: border-box;
      }
      textarea {
        width: 100%;
        min-height: 88px;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        box-sizing: border-box;
        resize: vertical;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 8px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        font-size: 12px;
        color: var(--text);
        user-select: none;
      }
      .chip input {
        width: 14px;
        height: 14px;
      }
      button {
        margin-top: 12px;
        width: 100%;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: #0b0d12;
        color: #fff;
        font-weight: 650;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .hint {
        margin-top: 10px;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.4;
      }
      .error {
        margin-top: 10px;
        font-size: 12px;
        color: #ffb4b4;
      }
      .results {
        margin-top: 16px;
      }
      .resultsHeader {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin: 16px 0 10px;
      }
      .resultsHeader h2 {
        font-size: 14px;
        margin: 0;
        letter-spacing: 0.2px;
      }
      .zipBtn {
        width: auto;
        padding: 8px 10px;
        margin: 0;
        border-radius: 10px;
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      @media (max-width: 820px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
      .item {
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.02);
      }
      .item header {
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        font-size: 12px;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      .item img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .thumb {
        width: 100%;
        aspect-ratio: var(--ar, 1 / 1);
        background: rgba(0, 0, 0, 0.08);
      }
      .item footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-top: 1px solid var(--border);
      }
      .dl {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 12px;
      }
      .dl.secondary {
        background: transparent;
        color: var(--text);
        opacity: 0.9;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Creative Resizer</h1>
        <p class="subtle">Upload up to 3 images, pick output sizes, then download each result or a ZIP of everything.</p>

        <div>
          <label>Image 1</label>
          <input id="image1" type="file" accept="image/*" />
        </div>
        <div style="margin-top: 10px">
          <label>Image 2 (optional)</label>
          <input id="image2" type="file" accept="image/*" />
        </div>
        <div style="margin-top: 10px">
          <label>Image 3 (optional)</label>
          <input id="image3" type="file" accept="image/*" />
        </div>

        <div style="margin-top: 14px">
          <label>Output Sizes</label>
          <div class="chips">
            <label class="chip"><input type="checkbox" name="sizes" value="1:1" /> 1:1 Square</label>
            <label class="chip"><input type="checkbox" name="sizes" value="4:5" /> 4:5 Portrait</label>
            <label class="chip"><input type="checkbox" name="sizes" value="9:16" /> 9:16 Story</label>
            <label class="chip"><input type="checkbox" name="sizes" value="16:9" /> 16:9 Landscape</label>
          </div>
        </div>

        <div style="margin-top: 14px">
          <label>Brand Instructions (optional)</label>
          <textarea id="instructions" placeholder="e.g. white minimalist background, keep the logo visible, premium look"></textarea>
          <div class="hint">Note: instructions are stored in the ZIP as <code>instructions.txt</code> (no AI processing).</div>
        </div>

        <button id="submit" disabled>Resize</button>
        <div id="error" class="error" style="display: none"></div>

        <div class="results" id="results" style="display: none">
          <div class="resultsHeader">
            <h2>Outputs</h2>
            <button class="zipBtn" id="downloadZip">Download as ZIP</button>
          </div>
          <div class="grid" id="outputs"></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
